<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Price Bot – ตั้งค่า</title>
  <style>
    body { font: 14px/1.5 "Segoe UI", system-ui, sans-serif; padding: 20px; max-width: 520px; color: #1d2027; }
    label { display: block; margin-bottom: 6px; font-weight: 600; }
    input { width: 100%; padding: 8px; font: inherit; box-sizing: border-box; }
    button { margin-top: 10px; padding: 8px 16px; font: inherit; cursor: pointer; }
    .muted { color: #666; font-size: 12px; }
  </style>
</head>
<body>
  <label for="base">ที่อยู่ของ Price Bot</label>
  <input id="base" placeholder="http://localhost:8000">
  <p class="muted">เปลี่ยนเฉพาะเมื่อรัน Price Bot ที่พอร์ตอื่น (ค่าเริ่มต้น http://localhost:8000)</p>
  <button id="save">บันทึก</button> <span id="status" class="muted"></span>
  <script src="options.js"></script>
</body>
</html>
